services:
  gateway:
    build:
      context: .
      args:
        SERVICE_NAME: gateway
    env_file: .env
    environment:
      - PORT=3000
      - AUTH_URL=http://auth:4001
      - CATALOG_URL=http://catalog:4002
      - CART_URL=http://cart:4003
      - ORDER_URL=http://order:4004
      - PAYMENT_URL=http://payment:4005
      - NOTIFICATION_URL=http://notification:4006
    ports:
      - "3000:3000"
    depends_on:
      - auth
      - catalog
      - cart
      - order
      - payment
      - notification

  auth:
    build:
      context: .
      args:
        SERVICE_NAME: auth
    env_file: .env
    environment:
      - PORT=4001
    ports:
      - "4001:4001"

  catalog:
    build:
      context: .
      args:
        SERVICE_NAME: catalog
    env_file: .env
    environment:
      - PORT=4002
    ports:
      - "4002:4002"

  cart:
    build:
      context: .
      args:
        SERVICE_NAME: cart
    env_file: .env
    environment:
      - PORT=4003
      - CATALOG_URL=http://catalog:4002
    ports:
      - "4003:4003"

  order:
    build:
      context: .
      args:
        SERVICE_NAME: order
    env_file: .env
    environment:
      - PORT=4004
      - CATALOG_URL=http://catalog:4002
    ports:
      - "4004:4004"

  payment:
    build:
      context: .
      args:
        SERVICE_NAME: payment
    env_file: .env
    environment:
      - PORT=4005
    ports:
      - "4005:4005"

  notification:
    build:
      context: .
      args:
        SERVICE_NAME: notification
    env_file: .env
    environment:
      - PORT=4006
    ports:
      - "4006:4006"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
